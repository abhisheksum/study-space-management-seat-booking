<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | StudyHub Console</title>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-screen">

  <div class="login-box">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="admin-brand-icon" style="width: 52px; height: 52px; font-size: 1.5rem; margin: 0 auto 1rem auto; border-radius: 14px;">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h2 style="font-family: 'Outfit', sans-serif; font-size: 1.6rem; color: var(--admin-text-main);">StudyHub Staff Portal</h2>
      <p style="font-size: 0.9rem; color: var(--admin-text-muted); margin-top: 0.35rem;">Sign in to access seat allocations & student records</p>
    </div>

    <form id="admin-login-form">
      
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 0.4rem;">Staff ID / Email</label>
        <div style="position: relative;">
          <input name="login" type="text" class="admin-search-input" style="width: 100%; padding-left: 2.5rem;" autocomplete="username" required>
          <i class="fa-regular fa-user" style="position: absolute; left: 14px; top: 13px; color: var(--admin-text-muted);"></i>
        </div>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem;">
          <label style="font-size: 0.88rem; font-weight: 700;">Password</label>
          <a href="#" style="font-size: 0.8rem; color: var(--admin-accent);">Forgot password?</a>
        </div>
        <div style="position: relative;">
          <input name="password" type="password" class="admin-search-input" style="width: 100%; padding-left: 2.5rem;" autocomplete="current-password" required>
          <i class="fa-solid fa-lock" style="position: absolute; left: 14px; top: 13px; color: var(--admin-text-muted);"></i>
        </div>
      </div>

      <button type="submit" class="admin-btn admin-btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1rem;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Login to Admin Console
      </button>
      <p id="admin-login-status" role="alert" hidden style="margin-top: 1rem; color: #f87171; text-align: center;"></p>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="../index.html" style="font-size: 0.88rem; color: var(--admin-text-muted);">
          &larr; Back to Public StudyHub Website
        </a>
      </div>

      <p style="font-size: 0.75rem; color: var(--admin-text-muted); text-align: center; margin-top: 2rem;">
        * Admin access requires a valid server-issued authentication token.
      </p>

    </form>

  </div>

  <script src="js/admin-auth.js"></script>
</body>
</html>
